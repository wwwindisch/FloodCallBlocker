name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      # Robolectric downloads its Android jars from Maven Central; cache them against flaky downloads.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml', 'app/src/test/resources/robolectric.properties') }}
      - name: ktlint
        run: ./gradlew ktlintCheck
      - name: Unit tests
        run: ./gradlew :core:test :app:testDebugUnitTest
      - name: Android Lint
        run: ./gradlew :app:lintDebug
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/

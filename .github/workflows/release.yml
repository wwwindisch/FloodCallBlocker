name: Release

on:
  push:
    tags: ["v*.*.*"]
  # Manual re-run for an existing tag (Actions → Release → Run workflow, pick the tag as "Use workflow from").
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Check version matches tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "versionName = \"$v\"" app/build.gradle.kts || { echo "versionName does not match tag $v"; exit 1; }
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed release APK
        env:
          FCB_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          FCB_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FCB_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FCB_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease
      - name: Extract release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "FloodCallBlocker-${GITHUB_REF_NAME}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ runner.temp }}/notes.md
          files: FloodCallBlocker-*.apk
